name: Multi-platform release

on:
  workflow_dispatch:

jobs:
  build_android_and_linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java for Android
        uses: actions/setup-java@v3
        with:
          distribution: "zulu"
          java-version: "17"
          cache: gradle

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libwebkit2gtk-4.1-dev squashfs-tools desktop-file-utils

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: "master"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: BuildRunner
        run: dart run build_runner build --delete-conflicting-outputs --workspace

      - name: Sign Android release
        working-directory: re_ucm_app
        run: |
          echo '${{ secrets.ANDROID_KEYSTORE_FILE_BASE64 }}' | base64 --decode > android/app/upload-keystore.jks
          echo '${{ secrets.ANDROID_KEY_PROPERTIES }}' > android/key.properties

      - name: Build Android release
        working-directory: re_ucm_app
        run: |
          mkdir -p app-build

          flutter build apk --flavor prod --release
          flutter build apk --flavor prod --release --split-per-abi

          cp ./build/app/outputs/flutter-apk/app-prod-release.apk "./app-build/ReUCM_android.apk"
          cp ./build/app/outputs/flutter-apk/app-arm64-v8a-prod-release.apk "./app-build/ReUCM_android_arm64-v8a.apk"
          cp ./build/app/outputs/flutter-apk/app-armeabi-v7a-prod-release.apk "./app-build/ReUCM_android_armeabi-v7a.apk"
          cp ./build/app/outputs/flutter-apk/app-x86_64-prod-release.apk "./app-build/ReUCM_android_x86_64.apk"

      - name: Build Linux release
        working-directory: re_ucm_app
        run: |
          flutter build linux --release
          tar -czvf "./app-build/ReUCM_linux.tar.gz" -C "./build/linux/x64/release/bundle" .

          # Build .deb installer
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          mkdir -p deb-dir/DEBIAN
          mkdir -p deb-dir/usr/lib/re_ucm
          mkdir -p deb-dir/usr/bin
          mkdir -p deb-dir/usr/share/applications
          mkdir -p deb-dir/usr/share/icons/hicolor/512x512/apps

          cat << EOF > deb-dir/DEBIAN/control
          Package: re-ucm
          Version: ${VERSION}
          Architecture: amd64
          Maintainer: BooksFine
          Description: ReUCM Reader Application
          Depends: libgtk-3-0, libwebkit2gtk-4.1-0
          EOF

          cp -r ./build/linux/x64/release/bundle/* deb-dir/usr/lib/re_ucm/
          ln -sf /usr/lib/re_ucm/re_ucm deb-dir/usr/bin/re_ucm

          cat << 'EOF' > deb-dir/usr/share/applications/dev.pages.reucm.app.desktop
          [Desktop Entry]
          Name=ReUCM
          Exec=/usr/bin/re_ucm
          Icon=re_ucm
          Type=Application
          Categories=Utility;
          EOF

          cp ./snap/gui/re_ucm.png deb-dir/usr/share/icons/hicolor/512x512/apps/re_ucm.png

          dpkg-deb --build deb-dir "./app-build/ReUCM_linux_amd64.deb"

          # Build AppImage
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract

          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/lib
          mkdir -p AppDir/usr/share/icons/hicolor/512x512/apps

          cp -r ./build/linux/x64/release/bundle/* AppDir/usr/bin/
          cp ./snap/gui/re_ucm.png AppDir/re_ucm.png
          cp ./snap/gui/re_ucm.png AppDir/.DirIcon
          cp ./snap/gui/re_ucm.png AppDir/usr/share/icons/hicolor/512x512/apps/re_ucm.png

          cat << 'EOF' > AppDir/re_ucm.desktop
          [Desktop Entry]
          Name=ReUCM
          Exec=re_ucm
          Icon=re_ucm
          Type=Application
          Categories=Utility;
          EOF

          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/bin/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/re_ucm" "$@"
          EOF
          chmod +x AppDir/AppRun

          ARCH=x86_64 ./squashfs-root/AppRun AppDir "./app-build/ReUCM_linux.AppImage"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ReUCM_android.apk
          path: re_ucm_app/app-build/ReUCM_android.apk
          retention-days: 3

      - name: Upload Android arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: ReUCM_android_arm64-v8a.apk
          path: re_ucm_app/app-build/ReUCM_android_arm64-v8a.apk
          retention-days: 3

      - name: Upload Android armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: ReUCM_android_armeabi-v7a.apk
          path: re_ucm_app/app-build/ReUCM_android_armeabi-v7a.apk
          retention-days: 3

      - name: Upload Android x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: ReUCM_android_x86_64.apk
          path: re_ucm_app/app-build/ReUCM_android_x86_64.apk
          retention-days: 3

      - name: Upload Linux archive
        uses: actions/upload-artifact@v4
        with:
          name: ReUCM_linux.tar.gz
          path: re_ucm_app/app-build/ReUCM_linux.tar.gz
          retention-days: 3

      - name: Upload Linux .deb package
        uses: actions/upload-artifact@v4
        with:
          name: ReUCM_linux_amd64.deb
          path: re_ucm_app/app-build/ReUCM_linux_amd64.deb
          retention-days: 3

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: ReUCM_linux.AppImage
          path: re_ucm_app/app-build/ReUCM_linux.AppImage
          retention-days: 3

  build_windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: "master"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: BuildRunner
        run: dart run build_runner build --delete-conflicting-outputs --workspace

      - name: Build Windows release
        working-directory: re_ucm_app
        run: flutter build windows --release

      - name: Build installer and portable .7z archive
        working-directory: re_ucm_app
        shell: bash
        run: |
          echo "Creating portable 7z archive"
          "/c/Program Files/7-Zip/7z.exe" a -t7z -m0=lzma2 -mx=9 -mfb=64 -md=32m -ms=on "./build/ReUCM_windows_portable.7z" "./build/Windows/x64/runner/Release/"

          echo "Downloading and installing Inno installer"
          make innoinstall

          echo "Creating Windows installer"
          make inno

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ReUCM_windows.exe
          path: re_ucm_app/build/ReUCM_windows.exe
          retention-days: 3

      - name: Upload portable archive
        uses: actions/upload-artifact@v4
        with:
          name: ReUCM_windows_portable.7z
          path: re_ucm_app/build/ReUCM_windows_portable.7z
          retention-days: 3

  build_macos:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: "master"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: BuildRunner
        run: dart run build_runner build --delete-conflicting-outputs --workspace

      - name: Build macOS DMG
        working-directory: re_ucm_app
        run: |
          mkdir -p app-build
          flutter build macos --release
          cd build/macos/Build/Products/Release

          create-dmg \
            --volname "ReUCM" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "ReUCM.app" 175 190 \
            --hide-extension "ReUCM.app" \
            --app-drop-link 425 190 \
            --no-internet-enable \
            "$GITHUB_WORKSPACE/re_ucm_app/app-build/ReUCM_macos.dmg" \
            "ReUCM.app" || true

          if [ ! -f "$GITHUB_WORKSPACE/re_ucm_app/app-build/ReUCM_macos.dmg" ]; then
            echo "Fallback: creating DMG with hdiutil"
            hdiutil create -volname "ReUCM" -srcfolder "ReUCM.app" -ov -format UDZO "$GITHUB_WORKSPACE/re_ucm_app/app-build/ReUCM_macos.dmg"
          fi

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: ReUCM_macos.dmg
          path: re_ucm_app/app-build/ReUCM_macos.dmg
          retention-days: 3

  publish:
    runs-on: ubuntu-latest
    needs: [build_android_and_linux, build_windows, build_macos]

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - id: read-version
        shell: bash
        run: echo "version=$(grep '^version:' re_ucm_app/pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)" >> $GITHUB_OUTPUT

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: build/
          merge-multiple: true

      - name: Create a GitHub release
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: ""
          custom_tag: ${{ steps.read-version.outputs.version }}

      - name: Extract latest changelog
        shell: bash
        working-directory: re_ucm_app
        run: |
          # Extract everything from the first ### header until the second one appears
          awk '/^### /{if (n++ == 1) exit} n' CHANGELOG.md > RELEASE_NOTES.md
          
          # Fallback: if RELEASE_NOTES.md is empty, just use the whole file
          if [ ! -s RELEASE_NOTES.md ]; then cp CHANGELOG.md RELEASE_NOTES.md; fi

      - uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: ReUCM v${{ steps.tag_version.outputs.new_tag }}
          bodyFile: re_ucm_app/RELEASE_NOTES.md
          artifacts: "build/*.*"
