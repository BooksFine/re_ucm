name: Test Multi-platform build

on:
  workflow_dispatch:

jobs:
  build_android_and_linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java for Android
        uses: actions/setup-java@v3
        with:
          distribution: "zulu"
          java-version: "17"
          cache: gradle

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libepoxy-dev libwpewebkit-1.0-dev libwpebackend-fdo-1.0-dev libwpe-1.0-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: "master"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: BuildRunner
        run: dart run build_runner build --delete-conflicting-outputs --workspace

      - name: Sign Android release
        working-directory: re_ucm_app
        run: |
          echo '${{ secrets.ANDROID_KEYSTORE_FILE_BASE64 }}' | base64 --decode > android/app/upload-keystore.jks
          echo '${{ secrets.ANDROID_KEY_PROPERTIES }}' > android/key.properties

      - name: Build Android release
        working-directory: re_ucm_app
        run: |
          mkdir -p app-build

          flutter build apk --flavor prod --release
          flutter build apk --flavor prod --release --split-per-abi

          cp ./build/app/outputs/flutter-apk/app-prod-release.apk "./app-build/ReUCM_android.apk"
          cp ./build/app/outputs/flutter-apk/app-arm64-v8a-prod-release.apk "./app-build/ReUCM_android_arm64-v8a.apk"
          cp ./build/app/outputs/flutter-apk/app-armeabi-v7a-prod-release.apk "./app-build/ReUCM_android_armeabi-v7a.apk"
          cp ./build/app/outputs/flutter-apk/app-x86_64-prod-release.apk "./app-build/ReUCM_android_x86_64.apk"

      - name: Build Linux release
        working-directory: re_ucm_app
        run: |
          flutter build linux --release
          tar -czvf "./app-build/ReUCM_linux.tar.gz" -C "./build/linux/x64/release/bundle" .

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ReUCM_android.apk
          path: re_ucm_app/app-build/ReUCM_android.apk
          retention-days: 3

      - name: Upload Android arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: ReUCM_android_arm64-v8a.apk
          path: re_ucm_app/app-build/ReUCM_android_arm64-v8a.apk
          retention-days: 3

      - name: Upload Android armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: ReUCM_android_armeabi-v7a.apk
          path: re_ucm_app/app-build/ReUCM_android_armeabi-v7a.apk
          retention-days: 3

      - name: Upload Android x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: ReUCM_android_x86_64.apk
          path: re_ucm_app/app-build/ReUCM_android_x86_64.apk
          retention-days: 3

      - name: Upload Linux archive
        uses: actions/upload-artifact@v4
        with:
          name: ReUCM_linux.tar.gz
          path: re_ucm_app/app-build/ReUCM_linux.tar.gz
          retention-days: 3

  build_windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: "master"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: BuildRunner
        run: dart run build_runner build --delete-conflicting-outputs --workspace

      - name: Build Windows release
        working-directory: re_ucm_app
        run: flutter build windows --release

      - name: Build installer and portable .7z archive
        working-directory: re_ucm_app
        shell: bash
        run: |
          echo "Creating portable 7z archive"
          "/c/Program Files/7-Zip/7z.exe" a -t7z -m0=lzma2 -mx=9 -mfb=64 -md=32m -ms=on "./build/ReUCM_windows_portable.7z" "./build/Windows/x64/runner/Release/"

          echo "Downloading and installing Inno installer"
          make innoinstall

          echo "Creating Windows installer"
          make inno

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ReUCM_windows.exe
          path: re_ucm_app/build/ReUCM_windows.exe
          retention-days: 3

      - name: Upload portable archive
        uses: actions/upload-artifact@v4
        with:
          name: ReUCM_windows_portable.7z
          path: re_ucm_app/build/ReUCM_windows_portable.7z
          retention-days: 3

  build_macos:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: "master"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: BuildRunner
        run: dart run build_runner build --delete-conflicting-outputs --workspace

      - name: Build macOS DMG
        working-directory: re_ucm_app
        run: |
          mkdir -p app-build
          flutter build macos --release
          cd build/macos/Build/Products/Release

          create-dmg \
            --volname "ReUCM" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "ReUCM.app" 175 190 \
            --hide-extension "ReUCM.app" \
            --app-drop-link 425 190 \
            --no-internet-enable \
            "../../../../../re_ucm_app/app-build/ReUCM_macos.dmg" \
            "ReUCM.app" || true

          if [ ! -f "../../../../../re_ucm_app/app-build/ReUCM_macos.dmg" ]; then
            echo "Fallback: creating DMG with hdiutil"
            hdiutil create -volname "ReUCM" -srcfolder "ReUCM.app" -ov -format UDZO "../../../../../re_ucm_app/app-build/ReUCM_macos.dmg"
          fi

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: ReUCM_macos.dmg
          path: re_ucm_app/app-build/ReUCM_macos.dmg
          retention-days: 3
