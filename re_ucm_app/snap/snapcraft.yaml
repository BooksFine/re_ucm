name: re_ucm
version: 3.0.1
summary: Generated by Icons Launcher
description: Generated by Icons Launcher package for Linux.

confinement: strict
base: core22
grade: stable

slots:
  dbus-re_ucm: # adjust accordingly to your app name
    interface: dbus
    bus: session
    name: org.bar.re_ucm # adjust accordingly to your app name

apps:
  re_ucm:
    command: re_ucm
    extensions: [gnome] # gnome includes the libraries required by flutter
    plugs:
    - network
    slots:
      - dbus-re_ucm
parts:
  re_ucm:
    source: .
    plugin: flutter
    flutter-target: lib/main.dart # The main entry-point file of the application
