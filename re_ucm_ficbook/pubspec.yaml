name: re_ucm_ficbook
description: "Plugin that adds Ficbook support to ReUCM"
version: 1.0.0
homepage: "https://reucm.pages.dev"
repository: https://github.com/BooksFine/re_ucm_ficbook
publish_to: none

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  dio: ^5.7.0
  re_ucm_core: any
  json_annotation: ^4.12.0
  freezed_annotation: ^3.1.0
  html: ^0.15.6
  dart_book:
    path: ../../dart_book

dev_dependencies:
  build_runner: ^2.11.0
  lints: ^6.0.0
  freezed: ^3.0.0
  json_serializable: ^6.9.4

flutter:
  assets:
    - assets/logo.svg
